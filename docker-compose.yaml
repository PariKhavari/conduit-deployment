services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is not set}/conduit-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - backend-static:/app/staticfiles
    networks:
      - backend-net
      - frontend-net
    expose:
      - "8000"

  frontend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is not set}/conduit-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8282}:8080"
    volumes:
      - backend-static:/app/staticfiles:ro
    networks:
      - frontend-net

networks:
  frontend-net:
  backend-net:

volumes:
  db-data:
  backend-static: