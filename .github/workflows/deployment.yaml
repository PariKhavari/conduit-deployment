name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: conduit

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner_lc: ${{ steps.owner.outputs.ghcr_owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase GHCR owner
        id: owner
        run: echo "ghcr_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./conduit-backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.ghcr_owner }}/conduit-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.ghcr_owner }}/conduit-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./conduit-frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.ghcr_owner }}/conduit-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.ghcr_owner }}/conduit-frontend:latest

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
